name: Generate HSA Fund Chart

on:
  workflow_dispatch:
    inputs:
      fund_set:
        description: Funds to include
        required: true
        default: equity
        type: choice
        options:
          - equity
          - all
      mode:
        description: Compare normalized performance or raw adjusted prices
        required: true
        default: normalized
        type: choice
        options:
          - normalized
          - price

permissions:
  contents: write

concurrency:
  group: hsa-fund-chart-main
  cancel-in-progress: false

jobs:
  generate-chart:
    name: Generate ${{ inputs.fund_set }} ${{ inputs.mode }} charts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FUND_SET: ${{ inputs.fund_set }}
      CHART_MODE: ${{ inputs.mode }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Generate YTD, 3-month, 6-month, and 1-year charts
        run: |
          for chart_period in ytd 3mo 6mo 1y; do
            python hsa_fund_daily_chart.py \
              --fund-set "$FUND_SET" \
              --period "$chart_period" \
              --mode "$CHART_MODE" \
              --output "hsa_${FUND_SET}_funds_${chart_period}_${CHART_MODE}.png"
          done

      - name: Commit chart to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force \
            "hsa_${FUND_SET}_funds_ytd_${CHART_MODE}.png" \
            "hsa_${FUND_SET}_funds_3mo_${CHART_MODE}.png" \
            "hsa_${FUND_SET}_funds_6mo_${CHART_MODE}.png" \
            "hsa_${FUND_SET}_funds_1y_${CHART_MODE}.png"

          if git diff --cached --quiet; then
            echo "Chart is unchanged; nothing to commit."
            exit 0
          fi

          git commit -m "Update HSA fund charts (${FUND_SET}, ${CHART_MODE})"
          git pull --rebase origin main
          git push origin HEAD:main
